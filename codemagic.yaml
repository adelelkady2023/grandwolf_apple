workflows:
  flutter_ios_no_codesign:
    name: Flutter iOS (no code signing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Ensure full Flutter project structure (generate iOS if missing)
        script: |
          set -euo pipefail
          if [ ! -d "ios" ] || [ ! -d "ios/Runner.xcodeproj" ]; then
            echo "Missing iOS project files. Generating with flutter create..."
            flutter create . --platforms=ios --project-name grandwolf_apple --org com.grandwolf
          else
            echo "iOS project files already exist."
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build iOS (unsigned)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  flutter_web_online_preview:
    name: Flutter Web Online Preview
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      vars:
        NETLIFY_DEPLOY_MESSAGE: "Codemagic web preview"

    scripts:
      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Ensure web platform exists
        script: |
          set -euo pipefail
          if [ ! -d "web" ]; then
            echo "Missing web folder. Generating with flutter create..."
            flutter create . --platforms=web --project-name grandwolf_apple --org com.grandwolf
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build web preview
        script: |
          flutter config --enable-web
          flutter build web --release

      - name: Deploy to Netlify (optional but recommended)
        script: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID not set."
            echo "Skipping online deployment. Artifacts will still be available for download."
            exit 0
          fi

          npm install -g netlify-cli
          netlify deploy \
            --dir=build/web \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$NETLIFY_DEPLOY_MESSAGE"

    artifacts:
      - build/web/**

    publishing:
      email:
        recipients:
          - a.a.kady@gmail.com
        notify:
          success: true
          failure: true
