workflows:
  flutter_ios_no_codesign:
    name: Flutter iOS (no code signing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Ensure full Flutter project structure (generate iOS if missing)
        script: |
          set -euo pipefail
          if [ ! -d "ios" ] || [ ! -d "ios/Runner.xcodeproj" ]; then
            echo "Missing iOS project files. Generating with flutter create..."
            flutter create . --platforms=ios --project-name grandwolf_apple --org com.grandwolf
          else
            echo "iOS project files already exist."
          fi

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build iOS (unsigned)
        script: |
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  flutter_web_preview:
    name: Flutter Web Preview
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Flutter doctor
        script: |
          flutter --version
          flutter doctor -v

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build web preview
        script: |
          flutter config --enable-web
          flutter build web --release

    artifacts:
      - build/web/**

    publishing:
      email:
        recipients:
          - a.a.kady@gmail.com
        notify:
          success: true
          failure: true
